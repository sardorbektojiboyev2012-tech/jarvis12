name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: jarvis-main
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: jarvis-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: jarvis-main/app/build/reports
          if-no-files-found: ignore
